name: crewmatch
description: "CrewMatch: swipe to find teammates, form a crew, and score at the hackathon."
publish_to: 'none'

version: 1.2.0+4

environment:
  sdk: ^3.13.7

dependencies:
  cupertino_icons: ^2.0.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^23.0.4
  google_fonts: ^9.0.0
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3
  http: ^1.6.0
  image_picker: ^1.2.4
  material_ui: ^1.8.0
  mobile_scanner: ^7.5.0
  open_filex: ^5.0.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  qr_flutter: ^4.1.0
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
