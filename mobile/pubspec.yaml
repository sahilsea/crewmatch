name: crewmatch
description: "CrewMatch: swipe to find teammates, form a crew, and score at the hackathon."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  cupertino_icons: ^2.0.0
  file_picker: ^13.4.0
  flutter:
    sdk: flutter
  google_fonts: ^9.0.0
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3
  http: ^1.6.0
  image_picker: ^1.2.4
  material_ui: ^1.8.0
  open_filex: ^5.0.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
